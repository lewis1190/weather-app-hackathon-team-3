
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Card - Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
          <a class="navbar-brand" href="index.html">
            <span class="brand-logo" aria-hidden="true">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weather logo">
                <defs>
                  <linearGradient id="g1" x1="0" x2="1">
                    <stop offset="0" stop-color="#ffd166"/>
                    <stop offset="1" stop-color="#ffaf4d"/>
                  </linearGradient>
                </defs>
                <g>
                  <circle cx="20" cy="20" r="8" fill="url(#g1)" />
                  <path d="M46 34a8 8 0 0 0-8-8 9 9 0 0 0-1 .06A10 10 0 0 0 24 20a11 11 0 0 0-1 .06A8 8 0 1 0 26 44h20a6 6 0 0 0 0-12z" fill="#e6eef8"/>
                </g>
              </svg>
            </span>
            <span class="brand-text">Weather App</span>
          </a>
        </div>
      </nav>
    </header>

    <main class="container mb-5">
      <div id="weather-card" class="card shadow-sm">
        <div class="card-body d-flex gap-4 align-items-center">
          <img id="weather-icon" src="assets/images/logo1.png" alt="icon" width="96" height="96">
          <div>
            <h3 id="weather-city" class="card-title mb-0">City, Country</h3>
            <div id="weather-desc" class="text-muted">Clear sky</div>
            <h1 id="weather-temp" class="display-4 mb-0">--°C</h1>
            <div class="small text-muted" id="last-updated">Last updated: --</div>
          </div>
          <div class="ms-auto text-end">
            <div>Humidity: <span id="weather-humidity">--</span>%</div>
            <div>Wind: <span id="weather-wind">--</span> m/s</div>
          </div>
        </div>
      </div>

      <!-- Hourly and Daily forecast sections (populated by js/app.js) -->
      <div class="row mt-4">
        <div class="col-12">
          <div id="hourly-forecast" class="card mb-3">
            <div class="card-header">Hourly Forecast</div>
            <div class="card-body">
              <div class="small text-muted mb-2">Hourly data will appear here after a successful search.</div>
              <div id="hourly-list" class="d-flex gap-2 overflow-auto" style="min-height:64px">
                <!-- Example item structure JS can append: .hour-item -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div id="daily-forecast" class="card">
            <div class="card-header">Daily Forecast</div>
            <div class="card-body">
              <div class="small text-muted mb-2">Daily summary will appear here after a successful search.</div>
              <div id="daily-list">
                <!-- Example item structure JS can append: .day-item -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-light py-3 mt-4">
      <div class="container d-flex flex-column flex-md-row align-items-center gap-2">
        <div class="text-muted">&copy; <span id="year"></span> Weather App</div>
        <div class="ms-md-auto small">
          <a href="https://openweathermap.org/" target="_blank" rel="noopener">Data: OpenWeatherMap</a>
        </div>
      </div>
    </footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.local.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
