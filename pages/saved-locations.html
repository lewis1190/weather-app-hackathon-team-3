<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Browser Title -->
  <title>TrueWeather | Saved Locations</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/d2b8795f3e.js" crossorigin="anonymous"></script>

  <!-- Custom CSS -->
  <link href="../styles.css" rel="stylesheet">

  <!-- Favicon Stuff -->
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="../assets/favicon/site.webmanifest">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container">
        <a class="navbar-brand" href="../index.html"><i class="fa-solid fa-cloud"></i> &nbsp;TrueWeather</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="#">Saved Locations</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container mb-5">

    <div id="favorite-locations-header">
      <h2 class="mb-3 text-center">My Saved Locations</h2>
      <div class="text-center text-muted mb-2">Click on a location card for more details or to remove it from your saved locations.</div>
    </div>

    <div id="alert-container" class="my-2"></div>

    <div id="favorite-locations-container" class="mt-2">
      <div id="favorite-locations-cards" class="row g-3 row-cols-1 d-flex justify-content-center align-items-center"></div>
    </div>

    <div id="weather-card" class="card shadow-sm d-none">
      <div class="card-body d-flex gap-4 align-items-center">
        <img id="weather-icon" src="" alt="icon" width="96" height="96">
        <div>
          <h3 id="weather-city" class="card-title mb-0"></h3>
          <div id="weather-desc" class="text-muted"></div>
          <h1 id="weather-temp" class="display-4 mb-0"></h1>
          <div id="last-updated" class="small text-muted"></div>
        </div>
        <div class="ms-auto text-end">
          <div>Humidity: <span id="weather-humidity"></span>%</div>
          <div>Wind: <span id="weather-wind"></span> m/s</div>
          <button id="save-location-btn" class="btn btn-outline-danger mt-4">Remove</button>
          <button id="more-info-btn" class="btn btn-outline-primary mt-4">More Info</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./saved-locations-ui.js"></script>

  <footer class="bg-light py-3 mt-4">
    <div class="container d-flex flex-column flex-md-row align-items-center gap-2">
      <div class="text-muted">&copy; <span id="year"></span> TrueWeather. All rights reserved.</div>
      <div class="d-flex ms-md-3 small footer-links align-items-baseline gap-1">
        <a href="https://www.metoffice.gov.uk/weather/warnings-and-advice" target="_blank" rel="noopener">
          <i class="fa-solid fa-cloud footer-icon" aria-hidden="true"></i>&nbsp;
          <span>Weather warnings</span>
        </a>
        <span class="sep mx-3">|</span>
        <a href="https://github.com/lewis1190/weather-app-hackathon-team-3" target="_blank" rel="noopener">
          <i class="fa-brands fa-github footer-icon" aria-hidden="true"></i>&nbsp;
          <span>GitHub</span>
        </a>
        <span class="sep mx-3">|</span>
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener">
          <i class="fa-brands fa-linkedin footer-icon" aria-hidden="true"></i>&nbsp;
          <span>LinkedIn</span>
        </a>
      </div>
      <div class="ms-md-auto small">
        <a href="https://openweathermap.org/" target="_blank" rel="noopener">Data: OpenWeatherMap</a>
      </div>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>

</html>
