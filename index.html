<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+e2Yk6t6bKGSW6vGk1kQYkQbQ6v5Q5vYhZ+8JQmPo=" crossorigin="" />
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
          <a class="navbar-brand" href="#">
            <span class="brand-logo" aria-hidden="true">
              <!-- Simple sun + cloud SVG logo -->
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weather logo">
                <defs>
                  <linearGradient id="g1" x1="0" x2="1">
                    <stop offset="0" stop-color="#ffd166"/>
                    <stop offset="1" stop-color="#ffaf4d"/>
                  </linearGradient>
                </defs>
                <g>
                  <circle cx="20" cy="20" r="8" fill="url(#g1)" />
                  <g fill="#ffc857">
                    <rect x="19" y="6" width="2" height="6" rx="1" transform="rotate(0 20 9)" />
                    <rect x="19" y="34" width="2" height="6" rx="1" transform="rotate(0 20 37)" />
                    <rect x="6" y="19" width="6" height="2" rx="1" transform="rotate(0 9 20)" />
                    <rect x="34" y="19" width="6" height="2" rx="1" transform="rotate(0 37 20)" />
                  </g>
                  <path d="M46 34a8 8 0 0 0-8-8 9 9 0 0 0-1 .06A10 10 0 0 0 24 20a11 11 0 0 0-1 .06A8 8 0 1 0 26 44h20a6 6 0 0 0 0-12z" fill="#e6eef8"/>
                </g>
              </svg>
            </span>
            <span class="brand-text">Weather App</span>
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="weather-card.html">Weather</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container mb-5">
      <!-- Alerts: rendered here by js/app.js -->
      <div class="row mb-3">
        <div class="col-12">
          <div id="alert-container"></div>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-12">
          <div class="controls-row">
            <div class="input-wrapper">
              <div class="input-group">
                <input id="city-input" type="text" class="form-control" placeholder="Enter city (e.g. London)" />
                <button id="search-btn" class="btn btn-primary">Search</button>
                <button id="loc-btn" class="btn btn-outline-secondary" title="Use my location">Use my location</button>
              </div>
            </div>

            <button id="refresh-btn" class="btn btn-success">Update now</button>

            <div class="form-check form-switch auto-wrap">
              <input class="form-check-input" type="checkbox" id="auto-refresh">
              <label class="form-check-label" for="auto-refresh">Auto-refresh</label>
            </div>

            <select id="refresh-interval" class="form-select w-auto">
              <option value="1">1m</option>
              <option value="5" selected>5m</option>
              <option value="15">15m</option>
            </select>
            <div class="form-check form-switch ms-2 heatmap-switch">
              <input class="form-check-input" type="checkbox" id="heatmap-toggle">
              <label class="form-check-label" for="heatmap-toggle">Heat map</label>
            </div>
          </div>
        </div>
      </div>

        <!-- Map container -->
        <div class="row mb-3">
          <div class="col-12">
              <div id="map" aria-label="Map showing location" role="region">
                <video id="map-hero" class="map-hero" autoplay muted loop playsinline>
                  <source src="assets/video/map.mp4" type="video/mp4">
                  Your browser does not support the video tag.
                </video>
              </div>
            </div>
        </div>

              <!-- Address section + form (below hero) -->
            <div class="row mb-3">
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <div class="row gx-3">
                      <div class="col-md-6">
                        <h5 class="card-title">Address</h5>
                        <div id="address-section" class="small text-muted">
                          <p class="mb-1">No address selected.</p>
                          <p id="address-display" class="mb-0">Use the form to enter an address or click on the map.</p>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <h5 class="card-title">Find by address</h5>
                        <form id="address-form" class="row g-2" onsubmit="return false;">
                          <div class="col-12">
                            <input id="addr-line" type="text" class="form-control" placeholder="Street address or place" />
                          </div>
                          <div class="col-6">
                            <input id="addr-city" type="text" class="form-control" placeholder="City" />
                          </div>
                          <div class="col-6">
                            <input id="addr-postal" type="text" class="form-control" placeholder="Postal code" />
                          </div>
                          <div class="col-12 text-end">
                            <button id="addr-submit" class="btn btn-primary">Lookup</button>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

              <!-- Heatmap container (toggle to show/hide) -->
      <div class="row mb-3">
        <div class="col-12">
          <div id="heatmap-container" class="d-none">
            <canvas id="heatmap-canvas"></canvas>
            <div class="heatmap-overlay muted">Demo heat map — toggle off to hide</div>
          </div>
        </div>
      </div>

      
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7kP5Qp1t5YkQWfP8i6ix7Y5b7k3k4fFvT0v4r0=" crossorigin=""></script>
    <script src="config.local.js"></script>
    <script src="js/app.js"></script>

    <footer class="bg-light py-3 mt-4">
      <div class="container d-flex flex-column flex-md-row align-items-center gap-2">
        <div class="text-muted">&copy; <span id="year"></span> Weather App</div>
        <div class="ms-md-auto small">
          <a href="https://openweathermap.org/" target="_blank" rel="noopener">Data: OpenWeatherMap</a>
        </div>
      </div>
    </footer>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
		<script>
			// If another page placed a pending alert into sessionStorage, show it here.
			(function () {
				try {
					const raw = sessionStorage.getItem('pendingAlert');
					if (!raw) return;
					const obj = JSON.parse(raw);
					// render into the alert container
					const container = document.getElementById('alert-container');
					if (container) {
						container.innerHTML = `
							<div class="alert alert-${obj.type || 'danger'} alert-dismissible fade show" role="alert">
								${obj.message}
								<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
							</div>`;
						if (obj.timeout && obj.timeout > 0) {
							setTimeout(() => { container.innerHTML = ''; }, obj.timeout);
						}
					}
					// clear it so it doesn't reappear
					sessionStorage.removeItem('pendingAlert');
				} catch (e) {
					console.warn('Failed to display pending alert', e);
				}
			})();
		</script>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
