<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Alerts - Weather App</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
			<link href="assets/css/styles.css" rel="stylesheet">
	</head>
	<body>
		<header>
		  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 sticky-top">
			  <div class="container">
				  <a class="navbar-brand" href="index.html">
						<span class="brand-logo" aria-hidden="true">
						  <!-- Simple sun + cloud SVG logo -->
						  <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weather logo">
							  <defs>
								  <linearGradient id="g1" x1="0" x2="1">
									  <stop offset="0" stop-color="#ffd166"/>
									  <stop offset="1" stop-color="#ffaf4d"/>
								  </linearGradient>
							  </defs>
							  <g>
								  <circle cx="20" cy="20" r="8" fill="url(#g1)" />
								  <g fill="#ffc857">
									  <rect x="19" y="6" width="2" height="6" rx="1" transform="rotate(0 20 9)" />
									  <rect x="19" y="34" width="2" height="6" rx="1" transform="rotate(0 20 37)" />
									  <rect x="6" y="19" width="6" height="2" rx="1" transform="rotate(0 9 20)" />
									  <rect x="34" y="19" width="6" height="2" rx="1" transform="rotate(0 37 20)" />
								  </g>
								  <path d="M46 34a8 8 0 0 0-8-8 9 9 0 0 0-1 .06A10 10 0 0 0 24 20a11 11 0 0 0-1 .06A8 8 0 1 0 26 44h20a6 6 0 0 0 0-12z" fill="#e6eef8"/>
							  </g>
						  </svg>
						</span>
						<span class="brand-text">Weather App</span>
				  </a>
				  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
					  <span class="navbar-toggler-icon"></span>
				  </button>
				  <div class="collapse navbar-collapse" id="navMenu">
					  <ul class="navbar-nav ms-auto">
						  <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
						  <li class="nav-item"><a class="nav-link" href="weather-card.html">Weather</a></li>
					  </ul>
				  </div>
			  </div>
		  </nav>
		</header>

		<main class="container my-4">
			<div class="card">
				<div class="card-body">
					<h2 class="h6">Alert Preview</h2>
					<p id="alert-preview" class="mb-2">No alerts to display.</p>
					<div id="alert-container"></div>
				</div>
			</div>

			<!-- Inserted weather card (moved from index.html) -->
			<div id="weather-card" class="card shadow-sm mt-4 d-none">
				<div class="card-body d-flex gap-4 align-items-center">
					<img id="weather-icon" src="" alt="icon" width="96" height="96">
					<div>
						<h3 id="weather-city" class="card-title mb-0"></h3>
						<div id="weather-desc" class="text-muted"></div>
						<h1 id="weather-temp" class="display-4 mb-0"></h1>
						<div class="small text-muted" id="last-updated"></div>
					</div>
					<div class="ms-auto text-end">
						<div>Humidity: <span id="weather-humidity"></span>%</div>
						<div>Wind: <span id="weather-wind"></span> m/s</div>
					</div>
				</div>
			</div>
		</main>

		<footer class="bg-light py-3 mt-4">
      <div class="container d-flex flex-column flex-md-row align-items-center gap-2">
        <div class="text-muted">&copy; <span id="year"></span> Weather App</div>
        <div class="ms-md-auto small">
          <a href="https://openweathermap.org/" target="_blank" rel="noopener">Data: OpenWeatherMap</a>
        </div>
      </div>
    </footer>

		<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
		<script>
			// If another page placed a pending alert into sessionStorage, show it here.
			(function () {
				try {
					const raw = sessionStorage.getItem('pendingAlert');
					if (!raw) return;
					const obj = JSON.parse(raw);
					// render into the alert container
					const container = document.getElementById('alert-container');
					if (container) {
						container.innerHTML = `
							<div class="alert alert-${obj.type || 'danger'} alert-dismissible fade show" role="alert">
								${obj.message}
								<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
							</div>`;
						if (obj.timeout && obj.timeout > 0) {
							setTimeout(() => { container.innerHTML = ''; }, obj.timeout);
						}
					}
					// clear it so it doesn't reappear
					sessionStorage.removeItem('pendingAlert');
				} catch (e) {
					console.warn('Failed to display pending alert', e);
				}
			})();
		</script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
